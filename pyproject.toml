[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-lab"
version = "0.1.0"
description = "Reproducible prompt-injection detection and held-out evaluation"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "joblib>=1.4,<2", "pyarrow>=18,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
injection-lab = "injection_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
